<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" class="arch-svg" role="img" aria-label="Four data lanes, each supporting a different claim and each with a declared limit">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .bx-hi { stroke: var(--color-accent); stroke-width: 1.6; }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 13px; font-weight: 700; }
    .arch-svg .it { fill: var(--color-fg); font-size: 11px; font-weight: 600; }
    .arch-svg .sub { fill: var(--color-fg-subtle); font-size: 10px; }
    .arch-svg .mu { fill: var(--color-fg-faint); font-size: 9.5px; }
    .arch-svg .cd { fill: var(--color-accent); font-size: 9.5px; }
    .arch-svg .bad { fill: var(--color-bad, #cf222e); font-size: 9.5px; }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.6; }
  </style>

  <text class="ttl" x="24" y="28">Four lanes, four different claims, four declared limits</text>
  <text class="sub" x="24" y="46">No lane is asked to support something it cannot. The limits are as load-bearing as the results.</text>

  <!-- lane 1 -->
  <rect class="bx bx-hi" x="24" y="70" width="205" height="150" rx="10"/>
  <text class="it" x="38" y="92">NASA C-MAPSS</text>
  <text class="mu" x="38" y="108">turbofan, US government work</text>
  <text class="cd" x="38" y="130">SUPPORTS</text>
  <text class="sub" x="38" y="146">the controlled experiment:</text>
  <text class="sub" x="38" y="160">1 operating condition vs 6,</text>
  <text class="sub" x="38" y="174">fault mode held fixed</text>
  <text class="bad" x="38" y="196">DOES NOT SUPPORT</text>
  <text class="sub" x="38" y="210">anything truck-specific</text>

  <!-- lane 2 -->
  <rect class="bx" x="245" y="70" width="205" height="150" rx="10"/>
  <text class="it" x="259" y="92">SCANIA APS</text>
  <text class="mu" x="259" y="108">real trucks, CC BY 4.0</text>
  <text class="cd" x="259" y="130">SUPPORTS</text>
  <text class="sub" x="259" y="146">decision under a published</text>
  <text class="sub" x="259" y="160">cost matrix, FP 10 / FN 500,</text>
  <text class="sub" x="259" y="174">verified in the dataset itself</text>
  <text class="bad" x="259" y="196">DOES NOT SUPPORT</text>
  <text class="sub" x="259" y="210">time series: one snapshot</text>

  <!-- lane 3 -->
  <rect class="bx" x="466" y="70" width="205" height="150" rx="10"/>
  <text class="it" x="480" y="92">SCANIA Component X</text>
  <text class="mu" x="480" y="108">23,550 real vehicles, CC BY 4.0</text>
  <text class="cd" x="480" y="130">SUPPORTS</text>
  <text class="sub" x="480" y="146">5-class failure-window</text>
  <text class="sub" x="480" y="160">prediction under a graded</text>
  <text class="sub" x="480" y="174">5x5 cost matrix</text>
  <text class="bad" x="480" y="196">DOES NOT SUPPORT</text>
  <text class="sub" x="480" y="210">continuous channels</text>

  <!-- lane 4 -->
  <rect class="bx" x="687" y="70" width="189" height="150" rx="10"/>
  <text class="it" x="701" y="92">Synthetic fleet</text>
  <text class="mu" x="701" y="108">ours, physically grounded, MIT</text>
  <text class="cd" x="701" y="130">SUPPORTS</text>
  <text class="sub" x="701" y="146">onset error against a truth</text>
  <text class="sub" x="701" y="160">that exists by construction;</text>
  <text class="sub" x="701" y="174">named physical channels</text>
  <text class="bad" x="701" y="196">DOES NOT SUPPORT</text>
  <text class="sub" x="701" y="210">anything about real trucks</text>

  <!-- the gap -->
  <rect class="bx" x="24" y="252" width="852" height="120" rx="10" stroke-dasharray="6 4"/>
  <text class="it" x="42" y="278">The lane that does not exist</text>
  <text class="sub" x="42" y="300">No public, redistributable dataset of CONTINUOUS haul-truck telemetry with labelled faults was found.</text>
  <text class="sub" x="42" y="318">Component X is real trucks, but it ships per-readout histograms and accumulative counters, not channels.</text>
  <text class="sub" x="42" y="336">That is why the onset-error measurement lives on the synthetic lane: it is the only place the true onset instant exists.</text>
  <text class="mu" x="42" y="358">This is a limitation of the product, recorded here rather than left for a reader to discover.</text>
</svg>

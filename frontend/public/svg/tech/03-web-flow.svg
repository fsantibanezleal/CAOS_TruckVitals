<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" class="arch-svg" role="img" aria-label="The offline pipeline writes committed artifacts; the build overlays them; the site only replays them">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); font-size: 10px; fill: var(--color-fg-subtle); }
    .arch-svg .bx { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .bx-hi { stroke: var(--color-accent); stroke-width: 1.6; }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 13px; font-weight: 700; }
    .arch-svg .it { fill: var(--color-fg); font-size: 11px; font-weight: 600; }
    .arch-svg .sub { fill: var(--color-fg-subtle); font-size: 10px; }
    .arch-svg .mu { fill: var(--color-fg-faint); font-size: 9.5px; }
    .arch-svg .cd { fill: var(--color-accent); font-size: 9.5px; }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.6; marker-end: url(#tvArrow); }
  </style>
  <defs>
    <marker id="tvArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--color-fg-faint)"/>
    </marker>
  </defs>

  <text class="ttl" x="24" y="28">Nothing is computed in the browser</text>
  <text class="sub" x="24" y="46">Every number on every page is replayed from a committed artifact. There is no second copy typed into a page.</text>

  <rect class="bx" x="24" y="76" width="180" height="120" rx="10"/>
  <text class="it" x="38" y="100">1. Offline pipeline</text>
  <text class="mono" x="38" y="120">data-pipeline/run_*.py</text>
  <text class="sub" x="38" y="140">Python, a pinned engine,</text>
  <text class="sub" x="38" y="154">real datasets on disk.</text>
  <text class="mu" x="38" y="176">Minutes to hours. Never</text>
  <text class="mu" x="38" y="188">on a page load.</text>

  <path class="flow" d="M210,136 L246,136"/>

  <rect class="bx bx-hi" x="252" y="76" width="180" height="120" rx="10"/>
  <text class="it" x="266" y="100">2. Committed artifacts</text>
  <text class="mono" x="266" y="120">data/artifacts/*.json</text>
  <text class="sub" x="266" y="140">Strict JSON, gated: a bare</text>
  <text class="sub" x="266" y="154">NaN fails the test suite.</text>
  <text class="cd" x="266" y="176">The single source of every</text>
  <text class="cd" x="266" y="188">number on this site.</text>

  <path class="flow" d="M438,136 L474,136"/>

  <rect class="bx" x="480" y="76" width="180" height="120" rx="10"/>
  <text class="it" x="494" y="100">3. Build overlay</text>
  <text class="mono" x="494" y="120">copy-data.mjs</text>
  <text class="sub" x="494" y="140">Copies artifacts into</text>
  <text class="mono" x="494" y="154">public/data/</text>
  <text class="mu" x="494" y="176">A missing artifact FAILS</text>
  <text class="mu" x="494" y="188">the build, never renders blank.</text>

  <path class="flow" d="M666,136 L702,136"/>

  <rect class="bx" x="708" y="76" width="168" height="120" rx="10"/>
  <text class="it" x="722" y="100">4. Static site</text>
  <text class="sub" x="722" y="120">React, uPlot, no server.</text>
  <text class="sub" x="722" y="140">The App fetches ONE truck</text>
  <text class="sub" x="722" y="154">at a time; the index is 1 kB.</text>
  <text class="mu" x="722" y="176">Fetch, parse, draw. That is</text>
  <text class="mu" x="722" y="188">the whole runtime.</text>

  <rect class="bx" x="24" y="228" width="852" height="128" rx="10"/>
  <text class="it" x="42" y="252">Why this shape, and not a live compute</text>
  <text class="sub" x="42" y="274">A number typed into a page is a number that can disagree with the pipeline and still render. An earlier version of</text>
  <text class="sub" x="42" y="292">this site asserted its headline figures as literals in prose. When an adversarial review moved those numbers, the</text>
  <text class="sub" x="42" y="310">prose went on claiming the old ones, because prose cannot notice.</text>
  <text class="sub" x="42" y="332">Rendering from the artifact makes that impossible: if the pipeline moves, the page moves, and if an artifact is</text>
  <text class="sub" x="42" y="350">missing the page says so instead of showing a stale figure.</text>
</svg>

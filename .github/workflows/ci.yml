name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (offline lane + dev + editable pkg)
        run: pip install -r requirements-precompute.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check data-pipeline tests
      - name: Tests
        run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The App ships a SECOND implementation of the engine, in TypeScript, for its live lane. Two
      # implementations of one method can disagree, and if they do the App shows numbers this pipeline
      # would not produce while both suites stay green. This is the gate that stops that.
      - name: Engine parity, browser lane against the Python engine
        run: cd frontend && npm ci && npm test
      - name: Pipeline smoke (sandboxed; canonical artifacts are read-only)
        run: |
          python data-pipeline/run_synthetic_benchmark.py --quick             --output "${{ runner.temp }}/smoke"
          python data-pipeline/run_fleet_traces.py --n-healthy 2 --n-faulty 2             --output "${{ runner.temp }}/smoke"
      - name: The committed artifacts are present and browser-parseable
        run: python scripts/check_artifacts.py

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Base-integrity guards (the regressions this archetype forbids)
        run: |
          fail=0
          # a real .env must never be tracked (only .env.example)
          if git ls-files | grep -qE '(^|/)\.env(\..+)?$' && ! git ls-files | grep -qx '.env.example'; then
            echo "::error::a real .env is tracked (only .env.example may be)"; fail=1; fi
          # venvs / native binaries / heavy model blobs must never be tracked
          if git ls-files | grep -qiE '(^|/)\.?venv|\.(dll|so|dylib|pt|pth)$'; then
            echo "::error::a venv or native/heavy binary is tracked (recreate from requirements; keep models small/LFS)"; fail=1; fi
          # raw/heavy data must never be tracked, commit only compact derived artifacts under data/derived/
          if git ls-files | grep -qiE '\.(parquet|h5|hdf5|nc|mat|npy)$'; then
            echo "::error::raw/heavy data tracked, commit only compact derived artifacts (data/derived/)"; fail=1; fi
          # no leaked local machine paths in tracked sources
          if git grep -nF 'D:\_Repos' -- . ':!.github' >/dev/null 2>&1; then
            echo "::error::leaked local machine path (D:\\_Repos) in a tracked file"; fail=1; fi
          if [ "$fail" -eq 0 ]; then echo "guards: OK"; fi
          exit $fail
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No template residue (instantiated products must replace the example pipeline)
        run: python scripts/check_template_residue.py
      - name: No em-dash or emoji in product content (ADR-0067)
        run: python scripts/check_content_standards.py
      # The residue gate greps for known tokens, so residue naming PLAUSIBLE but nonexistent files
      # sails through it; that class survived for weeks until a code-opening audit caught it. This
      # gate closes it mechanically: every repo path a tracked markdown file names must exist.
      - name: Every repo path the docs name exists
        run: python scripts/check_doc_paths.py

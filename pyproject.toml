# Repo-local tool configuration ONLY. A product declares NO package of its own.
# See conventions/no-internal-packages.md: if a package is required it is a SEPARATE REPO with a
# valid PyPI project, published, and consumed as a dependency (milldem, minehaulsim, oreblocks).
# data-pipeline/ is scripts, invoked by path: python data-pipeline/run.py
# Product-repo template, the offline engine package (ADR-0057). Rename `pipeline` -> `pipeline` per product.
# The EXAMPLE engine is numpy-only on purpose (an instantly-installable, no-hang reference); a real product pins
# its research-chosen SOTA engines in data-pipeline/requirements.txt and documents them in docs/frameworks/.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
ignore = [
    # A runner has to extend sys.path before it can import the offline package, because these scripts are
    # invoked BY PATH and the package is deliberately not installed (this repo declares no package of its
    # own). Every import after that hack is E402 by construction. Set here rather than as per-line noqa
    # comments: ruff versions disagree about whether E402 is on by default, so noqa markers were unused
    # directives (RUF100) on one version and the only thing keeping CI green on another.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# The lanes deliberately expose a few private helpers to the runners that bake their artifacts.
"data-pipeline/run_*.py" = ["E501"]
